name: Tests

on:
  push:
    paths:
      - "**.py"
      - "config.json"
      - "overrides.json"
      - "epg_aliases.json"
      - "favorites.json"
      - "profiles.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**.py"
      - "config.json"
      - "overrides.json"
      - "epg_aliases.json"
      - "favorites.json"
      - "profiles.json"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      live_check:
        description: Run isolated public-network diagnostics (12 channels, 2 decoder samples)
        type: boolean
        default: false

      full_audit:
        description: Full isolated candidate-link audit with production guards (no publication)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python modules
        run: python -m compileall -q build_playlist.py iptv_builder tests
      - name: Offline unit and local-HTTP integration tests
        run: python -m unittest discover -s tests -v

  live-check:
    if: github.event_name == 'workflow_dispatch' && inputs.live_check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Ensure optional decoder tools for the requested live samples
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
      - name: Bounded live validation in scratch output only
        run: |
          set -euo pipefail
          python -m iptv_builder.diagnostics --limit 12 --playback-samples 2 2>&1 | tee live-validation.log
          git diff --exit-code
      - name: Upload isolated reports (no production publication or Telegram)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: live-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            live-validation.log
            .cache/live-validation/validation_summary.json
            .cache/live-validation/first_run.json
            .cache/live-validation/second_run.json
            .cache/live-validation/dry_run.json
            .cache/live-validation/output/*.m3u
            .cache/live-validation/output/index.html
            .cache/live-validation/output/build_report.json
            .cache/live-validation/output/build_stats.txt
            .cache/live-validation/output/.cache/iptv/link-health.json
            .cache/live-validation/output/.cache/iptv/last_run.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  full-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.full_audit
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Full dry-run audit (never replace production outputs)
        run: |
          set -euo pipefail
          python -u -m iptv_builder.audit 2>&1 | tee full-audit.log
          git diff --exit-code
      - name: Upload aggregate audit evidence only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: full-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            full-audit.log
            .cache/full-audit/audit_summary.json
          include-hidden-files: true
          retention-days: 14
