name: Update playlist

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force_check:
        description: Ignore cached healthy link results
        type: boolean
        default: false
      playback_checks:
        description: Enable bounded ffmpeg playback samples
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: playlist-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    # Dispatching an experimental branch must never publish its data to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      published_sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Restore last-known-good sources and link history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/iptv
          key: iptv-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            iptv-state-${{ github.ref_name }}-

      - name: Build playlist
        id: build
        env:
          FORCE_CHECK: ${{ inputs.force_check }}
          PLAYBACK_CHECKS: ${{ inputs.playback_checks }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$FORCE_CHECK" == 'true' ]]; then args+=(--force-check); fi
          if [[ "$PLAYBACK_CHECKS" == 'true' ]]; then args+=(--playback-checks); fi
          timeout --signal=TERM --kill-after=30s 105m python build_playlist.py "${args[@]}" 2>&1 | tee build.log

      - name: Commit and push generated files only
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git config user.name "playlist-bot"
          git config user.email "playlist-bot@users.noreply.github.com"
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          names = ["playlist.m3u", "playlist-backup.m3u", "build_stats.txt", "build_report.json",
                   "persian.m3u", "news.m3u", "music.m3u", "sports.m3u", "movies.m3u", "kids.m3u",
                   "dead_links.txt", "favorites.m3u", "index.html"]
          report = json.loads(Path("build_report.json").read_text(encoding="utf-8"))
          for name in report["personalization"]["managed_files"]:
              if not re.fullmatch(r"profile-[a-z0-9][a-z0-9-]{0,39}\.m3u", name):
                  raise ValueError("Unsafe generated profile filename")
              names.append(name)
          subprocess.run(["git", "add", "--", *[name for name in names if Path(name).is_file()]], check=True)
          PY

          # Drift must also block a no-content-change Pages deployment.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "main changed during the build; refusing stale output/deployment"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "No content changes to publish"
            exit 0
          fi

          git commit -m "Auto-update playlist $(date -u +%F)"
          # A concurrent human push after the check is safely rejected by Git.
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage Pages with latest telemetry and last meaningful publication
        run: python -m iptv_builder.site --root . --runtime .cache/iptv/last_run.json --output .cache/pages-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .cache/pages-site
          retention-days: 1

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playlist-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            .cache/iptv/last_run.json
            build_report.json
            index.html
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Telegram report
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_JOB_STATUS: ${{ job.status }}
          PLAYLIST_CHANGED: ${{ steps.commit.outputs.changed }}
        run: python -m iptv_builder.telegram

      - name: Save source caches, link history and snapshots
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/iptv
          key: iptv-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}


  deploy-pages:
    needs: update
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: read
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject a deployment superseded by a main update
        env:
          EXPECTED_HEAD: ${{ needs.update.outputs.published_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          actual=$(git ls-remote "https://github.com/$REPOSITORY.git" refs/heads/main | cut -f1)
          test -n "$EXPECTED_HEAD" && test "$actual" = "$EXPECTED_HEAD"
      - name: Check one-time Pages setup
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if mode=$(gh api "repos/$REPOSITORY/pages" --jq '.build_type' 2>/dev/null) && [ "$mode" = workflow ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pages is not enabled for Actions or is inaccessible. The owner must select Settings > Pages > Source: GitHub Actions. No site was deployed."
          fi
      - name: Deploy successful build only
        id: deployment
        if: steps.pages.outputs.ready == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
