name: Update playlist

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force_check:
        description: Ignore cached healthy link results
        type: boolean
        default: false
      playback_checks:
        description: Enable bounded ffmpeg playback samples
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: playlist-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    # Dispatching an experimental branch must never publish its data to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run offline tests
        run: python -m unittest discover -s tests -v

      - name: Restore last-known-good sources and link history
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/iptv
          key: iptv-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            iptv-state-${{ github.ref_name }}-

      - name: Build playlist
        id: build
        env:
          FORCE_CHECK: ${{ inputs.force_check }}
          PLAYBACK_CHECKS: ${{ inputs.playback_checks }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$FORCE_CHECK" == 'true' ]]; then args+=(--force-check); fi
          if [[ "$PLAYBACK_CHECKS" == 'true' ]]; then args+=(--playback-checks); fi
          python build_playlist.py "${args[@]}" 2>&1 | tee build.log

      - name: Commit and push generated files only
        id: commit
        run: |
          set -euo pipefail
          git config user.name "playlist-bot"
          git config user.email "playlist-bot@users.noreply.github.com"
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          names = ["playlist.m3u", "playlist-backup.m3u", "build_stats.txt", "build_report.json",
                   "persian.m3u", "news.m3u", "music.m3u", "sports.m3u", "movies.m3u", "kids.m3u",
                   "dead_links.txt", "favorites.m3u", "index.html"]
          report = json.loads(Path("build_report.json").read_text(encoding="utf-8"))
          for name in report["personalization"]["managed_files"]:
              if not re.fullmatch(r"profile-[a-z0-9][a-z0-9-]{0,39}\.m3u", name):
                  raise ValueError("Unsafe generated profile filename")
              names.append(name)
          subprocess.run(["git", "add", "--", *[name for name in names if Path(name).is_file()]], check=True)
          PY

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content changes to publish"
            exit 0
          fi

          # Never reset/rebase and replay stale outputs over a newer manual,
          # exclude, config or code change. A fresh run must rebuild that input.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "main changed during the build; refusing to publish stale outputs"
            exit 1
          fi

          git commit -m "Auto-update playlist $(date -u +%F)"
          # A concurrent human push after the check is safely rejected by Git.
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Save source caches, link history and snapshots
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/iptv
          key: iptv-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playlist-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.log
            .cache/iptv/last_run.json
            .cache/iptv/link-health.json
            build_report.json
            index.html
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Telegram report
        if: always() && env.TG_TOKEN != '' && env.TG_CHAT != ''
        env:
          BUILD_JOB_STATUS: ${{ job.status }}
          PLAYLIST_CHANGED: ${{ steps.commit.outputs.changed }}
        run: python -m iptv_builder.telegram
