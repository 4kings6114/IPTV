name: Update playlist

on:
  workflow_dispatch:   # فقط دستی اجرا می‌شود (هر روز خودکار اجرا نمی‌شود)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Telegram message
        if: env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          text="ℹ️ پلی‌لیست دستی است و آپدیت خودکار غیرفعال شده.
لینک فعلی:
https://raw.githubusercontent.com/${{ github.repository }}/main/playlist.m3u"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${text}"
