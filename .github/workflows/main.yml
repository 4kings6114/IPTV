name: Update playlist

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python build_playlist.py | tee build.log

      - name: Commit and push
        id: commit
        run: |
          git config user.name "playlist-bot"
          git config user.email "playlist-bot@users.noreply.github.com"
          git add playlist.m3u
          if git diff --cached --quiet; then
            echo "No changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update playlist $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Telegram success
        if: always() && env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            summary=$(head -n 1 build.log || echo Updated)
            text="✅ پلی‌لیست آپدیت شد
$summary

لینک:
https://raw.githubusercontent.com/${{ github.repository }}/main/playlist.m3u"
          else
            text="ℹ️ تغییری در پلی‌لیست نبود"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${text}"

      - name: Telegram failure
        if: failure() && env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          text="❌ خطا در آپدیت
https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${text}"
