name: Update playlist

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python build_playlist.py | tee build.log

      - name: Commit and push
        id: commit
        run: |
          git config user.name "playlist-bot"
          git config user.email "playlist-bot@users.noreply.github.com"
          git add playlist.m3u playlist-backup.m3u build_stats.txt \
                  persian.m3u news.m3u music.m3u sports.m3u movies.m3u kids.m3u 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update playlist $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Telegram report
        if: always() && env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          REPO="${{ github.repository }}"
          BASE="https://raw.githubusercontent.com/${REPO}/main"

          if [ "${{ job.status }}" = "failure" ]; then
            text="❌ خطا در آپدیت%0Ahttps://github.com/${REPO}/actions/runs/${{ github.run_id }}"
          else
            stats=$(head -n 1 build_stats.txt 2>/dev/null || echo Updated)
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              text="✅ پلی‌لیست آپدیت شد%0A$stats%0A%0A📥 همه کانال‌ها:%0A${BASE}/playlist.m3u%0A%0A🇮🇷 فارسی:%0A${BASE}/persian.m3u%0A📰 اخبار:%0A${BASE}/news.m3u%0A🎵 موزیک:%0A${BASE}/music.m3u%0A⚽ ورزشی:%0A${BASE}/sports.m3u%0A🎬 فیلم:%0A${BASE}/movies.m3u%0A👶 کودک:%0A${BASE}/kids.m3u"
            else
              text="ℹ️ تغییری نبود%0A$stats"
            fi
          fi

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true"
