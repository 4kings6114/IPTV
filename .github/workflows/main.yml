name: Update playlist

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python build_playlist.py | tee build.log

      - name: Commit and push
        id: commit
        run: |
          git config user.name "playlist-bot"
          git config user.email "playlist-bot@users.noreply.github.com"
          git add playlist.m3u playlist-backup.m3u build_stats.txt 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-update playlist $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Telegram report
        if: always() && env.TG_TOKEN != '' && env.TG_CHAT != ''
        run: |
          if [ "${{ job.status }}" = "failure" ]; then
            text="❌ خطا در آپدیت پلی‌لیست%0Ahttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            if [ -f build_stats.txt ]; then
              stats=$(head -n 1 build_stats.txt)
            else
              stats="Updated"
            fi

            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              text="✅ پلی‌لیست آپدیت شد%0A$stats%0A%0Aلینک:%0Ahttps://raw.githubusercontent.com/${{ github.repository }}/main/playlist.m3u%0A%0Aپشتیبان:%0Ahttps://raw.githubusercontent.com/${{ github.repository }}/main/playlist-backup.m3u"
            else
              text="ℹ️ تغییری در پلی‌لیست نبود%0A$stats"
            fi
          fi

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${text}"
