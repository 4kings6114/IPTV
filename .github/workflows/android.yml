name: Android trial APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      workspace_delivery_url:
        description: Optional one-time Arena workspace APK upload URL (leave empty for artifacts only)
        type: string
        required: false
        default: ""

permissions:
  contents: read
  checks: write

concurrency:
  group: android-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Check the pinned official Gradle wrapper
        run: echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
      - name: Cache Gradle downloads
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-${{ runner.os }}-
      - name: Preserve trial signing identity in the branch-scoped cache only
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/debug.keystore
          key: android-trial-signing-v1
      - name: Restore selected SDK packages
        id: sdk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/sdk-trial
          key: android-sdk-${{ runner.os }}-36-buildtools36-commandline12266719
      - name: Set up official Android SDK with bounded diagnostics
        id: sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/setup_sdk.py
      - name: Unit tests, Android lint, and installable debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_build.py
      - name: Verify signature and package metadata, then prepare downloads
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > app/build/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > app/build/badging.txt
          python3 tools/package_trial.py
      - name: Upload actual APK file without ZIP wrapping (not a public Release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: android/app/build/deliverables/*.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload installation guide and build metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-trial-install-${{ github.run_number }}
          path: |
            android/app/build/deliverables/*.md
            android/app/build/deliverables/*.json
            android/app/build/deliverables/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Optional one-time handoff of verified trial APK to Arena workspace
        if: github.event_name == 'workflow_dispatch' && inputs.workspace_delivery_url != ''
        continue-on-error: true
        env:
          WORKSPACE_DELIVERY_URL: ${{ inputs.workspace_delivery_url }}
        run: python3 tools/upload_workspace.py
      - name: Upload test, lint, schema, and signature evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-trial-checks-${{ github.run_number }}
          path: |
            android/app/build/verification-summary.json
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/signature.txt
            android/app/build/badging.txt
            android/app/schemas/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save SDK downloads after successful setup
        if: always() && steps.sdk.outcome == 'success' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.android/sdk-trial
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Save Gradle downloads even when a source check needs fixing
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
